name: GitHub-Profile-Summary-Cards

on:
  schedule: # daily
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Default: ${{ secrets.SUMMARY_GITHUB_TOKEN }} (create this secret in repo settings)
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # Branch to push generated files to (default: main)
          BRANCH_NAME: "main"
          # UTC offset for "productive time" heatmap (optional)
          UTC_OFFSET: 9
          # Comma-separated languages to exclude (optional)
          EXCLUDE: ""
          # Whether to auto push generated files back to the branch
          AUTO_PUSH: true
          # THEME: set to a single theme (e.g. "github_dark") to generate only that theme
          THEME: "github"
          # ANIMATION: none | fade | rise | draw | stagger | load | sequence | tint | rgb | rgb-soft
          ANIMATION: ""
          DURATION: ""
          NAME: ""
